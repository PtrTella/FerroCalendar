name: Build and Deploy

on:
  workflow_dispatch: # Avvio manuale (ON/OFF gestito dall'utente con 'Run workflow')
  # Per riattivare il deploy automatico a ogni commit, decommenta le righe sotto:
  # push:
  #   branches: ['main']

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare static files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      # Deploy to gh-pages branch (safe with continue-on-error if token permissions are read-only)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
        continue-on-error: true
